name: Verify
on: [push, pull_request]
jobs:
  compatibility-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - id: matrix
        run: node scripts/ci-compatibility.cjs matrix >> "$GITHUB_OUTPUT"
  compatibility:
    needs: compatibility-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compatibility-matrix.outputs.matrix) }}
    name: Angular ${{ matrix.angular }} (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Link the complete hoisted tree before running package install scripts.
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm --filter wkly-workspace --filter "${{ matrix.runtimePackage }}" rebuild --pending
      - run: node scripts/ci-compatibility.cjs verify ${{ matrix.angular }}
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      # Each importer keeps its own esbuild version after pnpm finishes linking.
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm rebuild --pending
      - run: corepack pnpm run build
      - run: corepack pnpm test
      - run: node scripts/ssr-check.cjs
      - run: corepack pnpm run showcase:build
      - run: corepack pnpm run pack:check
      - run: node scripts/playwright.cjs install --with-deps chromium firefox webkit
      - run: corepack pnpm run showcase:test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failures
          if-no-files-found: ignore
          path: |
            playwright-report
            test-results
