name: Verify
on: [push, pull_request]
jobs:
  node16:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run build
      - run: corepack pnpm test
      - run: node scripts/ssr-check.cjs
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run build
      - run: corepack pnpm test
      - run: node scripts/ssr-check.cjs
      - run: corepack pnpm run showcase:build
      - run: corepack pnpm run pack:check
      - run: corepack pnpm run showcase:browsers
      - run: corepack pnpm run showcase:test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: |
            playwright-report
            test-results
