name: Public showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v5
      - name: Compile public demo and static route documents
        run: npm run showcase:build
        env:
          WKLY_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          WKLY_SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - run: node scripts/playwright.cjs install --with-deps chromium
      - name: Check compiled controls and initial state
        run: npm run test:showcase
        env:
          WKLY_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          WKLY_TEST_BROWSERS: chromium
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/showcase

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
